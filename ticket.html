<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Ticket</title>
<link rel="stylesheet" href="style.css">
<link
rel="icon"
type="image/png"
href="favicon-32x32.png">

</head>

<body>
<img src="pattern-lines.svg"
     alt=""
     class="pattern-lines">

<img src="pattern-circle.svg"
     alt=""
     class="pattern-circle">

<img src="pattern-squiggly-line-top.svg"
     alt=""
     class="top-squiggle">

<img src="pattern-squiggly-line-bottom-desktop.svg"
     alt=""
     class="bottom-squiggle">

<header>
  <a href="index.html" class="logo-link">
    <img src="logo-full.svg" alt="Coding Conf Logo" class="logo">
  </a>
</header>

<main>

<section class="confirmation">

<h1 id="greeting">
Congrats!
</h1>

<p>Your ticket is ready.</p>

<div class="ticket">

    <div class="ticket-left">

        <div class="ticket-header">

    <img
        src="logo-mark.svg"
        alt="Conference logo">

    <div>

        <h2>Coding Conf</h2>

        <p class="ticket-date">
            Oct 26, 2026 | Papine, Kingston
        </p>

    </div>

</div>

        <div class="user-details">

            <img
                id="ticketAvatar"
                src="image-avatar.jpg"
                alt="Attendee Avatar">

            <div>

                <h3 id="ticketName"></h3>

                <div class="github-row">

                    <img
                        src="icon-github.svg"
                        alt="GitHub">

                    <span id="ticketGithub"></span>

                </div>

            </div>

        </div>

    </div>

    <div
        class="ticket-number"
        id="ticketNumber">
    </div>

</div>

</section>

</main>

<script src="ticket.js"></script>

</body>
</html>
